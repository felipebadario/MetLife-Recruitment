# Blueprint do Render: Dashboard > New > Blueprint > selecionar este repositório.
# Cria o serviço web (Docker) e o banco PostgreSQL. Durante a criação, o Render pede
# os valores marcados com sync: false (e-mail e senha do primeiro administrador).
services:
  - type: web
    name: metlife-recruitment-crm
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: DEMO_MODE
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: metlife-recruitment-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FIELD_ENCRYPTION_KEY
        generateValue: true
      - key: CPF_HASH_KEY
        generateValue: true
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: INITIAL_ADMIN_NAME
        value: Administrador

databases:
  - name: metlife-recruitment-db
    plan: free
    region: virginia
    databaseName: metlife_crm
    user: metlife_crm
