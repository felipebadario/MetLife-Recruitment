name: Capturas de tela

# Sobe o sistema com dados FICTÍCIOS, captura as telas principais e guarda as imagens na
# branch `screenshots` para revisão visual. Nenhum dado real é usado.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Build do frontend
        working-directory: apps/web
        run: npm install --no-audit --no-fund && npm run build
      - name: Backend com base fictícia
        working-directory: apps/api
        run: |
          pip install -r requirements.txt
          python -m app.cli init
          echo "DemoAdmin2026" | python -m app.cli create-user --role admin --name "Ana Demonstração" --email admin@demo.local
          echo "DemoViewer2026" | python -m app.cli create-user --role viewer --name "Bruno Demonstração" --email viewer@demo.local
          python -m app.cli seed-demo
          # Classificação de exemplo SÓ para as capturas (no sistema real, quem classifica é o administrador).
          python - <<'PY'
          from sqlalchemy import select
          from app.db.session import get_sessionmaker
          from app.models import FunnelStage, ProcessOutcome, ProcessStatus
          demo = {"PAGA": ("hired", 6), "REPRC": ("rejected", 3), "CANC": ("withdrawn", 2),
                  "AGUA": ("in_progress", 2), "ENVIA": ("in_progress", 4), "ENTRE": ("in_progress", 3)}
          with get_sessionmaker()() as db:
              stages = {s.position // 10: s for s in db.scalars(select(FunnelStage))}
              for status in db.scalars(select(ProcessStatus)):
                  if status.label in demo:
                      outcome, stage = demo[status.label]
                      status.outcome = ProcessOutcome(outcome)
                      status.funnel_stage_id = stages[stage].id
              db.commit()
          PY
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/health && break; sleep 1; done
      - name: Capturas
        run: |
          mkdir -p screenshots
          npm install --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium
          node scripts/screenshots.mjs || (cat /tmp/api.log; exit 1)
      - name: Publica na branch screenshots
        run: |
          cd screenshots
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Capturas de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" screenshots
