name: Pré-visualização

# Gera o frontend em modo de pré-visualização (API simulada no navegador, apenas
# dados fictícios) e guarda o resultado na branch `preview-dist`, de onde é publicado.
# Desde a Fase 2 a validação é feita no Render (sistema completo). Esta pré-visualização
# sem servidor cobre só a Fase 1 e fica disponível apenas sob demanda.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          VITE_PREVIEW: "true"
      - name: Teste rápido no navegador (planilha fictícia)
        working-directory: .
        run: |
          pip install openpyxl
          cd apps/api && python -c "from datetime import date; from app.importing.demo import build_cohort_workbook as b; open('/tmp/turma.xlsx','wb').write(b('DEMO T70', date(2026,1,21), first_id=5000, size=40, seed=1))" && cd ../..
          (cd apps/web/dist && python -m http.server 4173 >/dev/null 2>&1 &)
          npm install --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium
          mkdir -p preview-shots
          XLSX_FILE=/tmp/turma.xlsx node scripts/preview-smoke.mjs
      - name: Guarda as capturas na branch preview-shots
        if: always()
        working-directory: .
        run: |
          [ -d preview-shots ] || exit 0
          cd preview-shots
          git init -q -b preview-shots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Capturas da pré-visualização" || exit 0
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" preview-shots
      - name: Publica o build na branch preview-dist
        run: |
          cd dist
          git init -q -b preview-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Pré-visualização de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" preview-dist
