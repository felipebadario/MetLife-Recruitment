name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: Backend (testes e migrações)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check --output-format=github .
      - name: Testes
        if: success() || failure()
        shell: bash
        run: |
          set +e
          pytest -p no:cacheprovider -rfE --tb=line 2>&1 | tee pytest.out
          status=${PIPESTATUS[0]}
          # Falhas viram anotações visíveis na aba Checks do GitHub
          grep -E "^(FAILED|ERROR)|^/.*Error|^E  " pytest.out | head -20 | sed 's/^/::error::/'
          exit $status
      - name: Migrações aplicam do zero e batem com os modelos
        if: success() || failure()
        env:
          DATABASE_URL: sqlite:////tmp/ci-check.db
        run: |
          alembic upgrade head
          alembic check

  web:
    name: Frontend (tipos e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run build
