name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: Backend (testes e migrações)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Testes
        run: pytest
      - name: Migrações aplicam do zero e batem com os modelos
        env:
          DATABASE_URL: sqlite:////tmp/ci-check.db
        run: |
          alembic upgrade head
          alembic check

  web:
    name: Frontend (tipos e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run build
